[tool.poetry]
name = "cyberpunk"
version = "0.1.0"
description = "Test task"
authors = ["33olof33"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.112.0"
sqlalchemy = "^2.0.32"
pydantic = {extras = ["email"], version = "^2.8.2"}
uvicorn = "^0.30.6"
