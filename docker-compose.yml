version: "3"

services:
  backend:
    build: ./
    container_name: backend
    ports:
      - "8000:8000"
    restart: always
    depends_on:
      - postgres
    volumes:
      - .:/app
    networks:
      - mynetwork

  postgres:
    image: postgres:14
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=test
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=admin
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - mynetwork

volumes:
  pg_data: {}
  pgadmin_data: {}

networks:
  mynetwork:
    driver: bridge
